name: Auto Deploy to DirectAdmin cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd tonys-tires
          npm install

      - name: Build Next.js Static App
        run: |
          cd tonys-tires
          npm run build

      - name: Run Deploy Script
        run: |
          python deploy_script.py
